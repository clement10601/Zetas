name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      windows:
        description: "匯出 Windows 測試版"
        type: boolean
        default: true
      director_url:
        description: "預填進 director_url.txt 的導演網址（留空就不放）"
        type: string
        default: "https://zetas-director.fezone.tw"
      web:
        description: "匯出網頁版並發佈到 GitHub Pages"
        type: boolean
        default: true
      release_tag:
        description: "填了就把 zip 發佈成 GitHub Release（例如 playtest-0.2.0）"
        type: string
        default: ""

env:
  GODOT_VERSION: 4.4.1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Godot
        run: |
          curl -sSLo godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
      - run: pip install jsonschema
      - run: python tools/sync_engine.py
      - run: python engine/content-pack/validate.py --game zeworld.json
      - run: python tools/lore.py check
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: godot --headless --path . --import || true
      - run: godot --headless --path . -s res://tests/run_tests.gd

  windows:
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install Godot and the Windows template
        run: |
          curl -sSLo godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          python tools/fetch_export_template.py ${GODOT_VERSION} windows_release_x86_64.exe
      - run: python tools/sync_engine.py
      - run: godot --headless --path . --import || true
      - name: Export
        run: |
          mkdir -p build/windows
          godot --headless --path . --export-release "Windows Desktop" build/windows/Zetas.exe
          cp playtest/README.md build/windows/README.md
          test -s build/windows/Zetas.exe
      - name: Prefill director URL
        if: inputs.director_url != ''
        env:
          DIRECTOR_URL: ${{ inputs.director_url }}
        run: printf '%s\n' "$DIRECTOR_URL" > build/windows/director_url.txt
      - name: Zip
        run: cd build && mv windows Zetas && zip -qr Zetas-windows.zip Zetas && mv Zetas windows && unzip -l Zetas-windows.zip
      - name: Publish release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          gh release create "$TAG" build/Zetas-windows.zip \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Zetas 封閉測試版 $TAG" --notes-file playtest/RELEASE_NOTES.md
      - uses: actions/upload-artifact@v4
        with:
          name: Zetas-windows-${{ github.sha }}
          path: build/windows

  web:
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.web
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install Godot and the Web template
        run: |
          curl -sSLo godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          python tools/fetch_export_template.py ${GODOT_VERSION} web_nothreads_release.zip
      - run: python tools/sync_engine.py
      - run: godot --headless --path . --import || true
      - name: Export
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          test -s build/web/index.wasm && test -s build/web/index.pck
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - id: deploy
        uses: actions/deploy-pages@v4
